name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Install Android Build Tools 33.0.2
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

      - name: Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          CORDOVA_ANDROID_GRADLE_DISTRIBUTION_URL: https://services.gradle.org/distributions/gradle-8.7-all.zip
        run: |
          cordova create memelis_app com.hoangtuan.memelis "Memelis RPG"
          cd memelis_app
          
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.hoangtuan.memelis" version="1.0.0" xmlns="http://cordova.apache.org/ns/1.0" xmlns:android="http://schemas.android.com/apk/res/android" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>Memelis RPG</name>
              <description>Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt</description>
              <author email="hoangtuan@users.noreply.github.com">Hoang Tuan</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="https://localhost/*" />
              <allow-navigation href="http://*/*" />
              <allow-navigation href="https://*/*" />
              <preference name="Orientation" value="landscape" />
              <preference name="Fullscreen" value="true" />
              <preference name="KeepRunning" value="true" />
              <preference name="ShowTitle" value="false" />
              <preference name="ScrollEnabled" value="false" />
              <preference name="DisallowOverscroll" value="true" />
              <preference name="MixedContentMode" value="0" />
              <platform name="android">
                  <allow-intent href="market:*" />
                  <preference name="AndroidXEnabled" value="true" />
                  <preference name="scheme" value="https" />
                  <preference name="hostname" value="localhost" />
                  <preference name="AndroidInsecureFileModeEnabled" value="false" />
              </platform>
          </widget>
          EOF
          
          rm -rf www/*
          cp -r ../www/* www/
          
          cordova platform add android@12.0.1
          cordova build android --debug
          
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Memelis-RPG-Vietsub.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memelis-RPG-Android-APK
          path: Memelis-RPG-Vietsub.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt (v1.1.0)"
          files: Memelis-RPG-Vietsub.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
