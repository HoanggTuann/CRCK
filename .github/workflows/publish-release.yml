name: Publish Official Release

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  publish:
    name: Publish Official Unified Release
    runs-on: ubuntu-latest
    steps:
      - name: Download Built APK and IPA
        run: |
          echo "Downloading latest built APK..."
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o Memelis-RPG-Vietsub.apk \
            "https://github.com/HoanggTuann/CRCK/releases/download/v1.0.0-apk/Memelis-RPG-Vietsub.apk"
          
          echo "Downloading latest built IPA..."
          curl -L -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o Memelis-RPG-Vietsub.ipa \
            "https://github.com/HoanggTuann/CRCK/releases/download/v1.0.0-ipa/Memelis-RPG-Vietsub.ipa"
          
          ls -lh Memelis-RPG-Vietsub.*

      - name: Create Unified v1.0.0 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt (v1.0.0)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            # 🎮 Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt (v1.0.0)

            Phiên bản chính thức đầy đủ dành cho điện thoại di động (**Android** và **iOS**) với giao diện Việt hóa và hệ thống điều khiển cảm ứng được tối ưu hóa toàn diện.

            ---

            ## 📥 Tệp cài đặt tải về (Assets):
            - 🤖 **Android (APK)**: [`Memelis-RPG-Vietsub.apk`](https://github.com/HoanggTuann/CRCK/releases/download/v1.0.0/Memelis-RPG-Vietsub.apk)
            - 🍎 **iOS (IPA)**: [`Memelis-RPG-Vietsub.ipa`](https://github.com/HoanggTuann/CRCK/releases/download/v1.0.0/Memelis-RPG-Vietsub.ipa)

            ---

            ## ✨ Các tính năng tối ưu nổi bật:
            1. **Cần gạt ảo Analog Joystick 8 hướng**:
               - Thay thế cụm phím 4 nút D-Pad bằng cần gạt analog tròn mượt mà.
               - Hỗ trợ di chuyển đa hướng (kể cả đi chéo) mượt mà và tự đàn hồi về tâm.
            2. **Nút "CHẠY" chuyển đổi trạng thái (Toggle Dash)**:
               - Chạm 1 lần để bật tự động chạy liên tục (`🏃 BẬT` - sáng đèn vàng cam).
               - Chạm lại để tắt (trở về đi bộ). Không cần phải giữ lì ngón tay khi di chuyển!
            3. **Hệ thống đổi nhân vật nhanh chóng trong Menu**:
               - Trang bị 2 phím ảo `[◀ Q]` và `[E ▶]` chuyên dụng ngay trên màn hình.
               - Chạm trực tiếp vào ô chân dung / chỉ số nhân vật trong màn hình **Trang bị (Equips)** và **Kỹ năng (Skill)** để đổi qua lại ngay lập tức.
               - Hỗ trợ đổi nhân vật ngay cả khi con trỏ đang ở danh sách slot trang bị hoặc danh sách kỹ năng.
               - Hỗ trợ đầy đủ phím cứng **Q** và **E** trên bàn phím.
            4. **Tương tác cảm ứng 1 chạm (1-Tap Selection)**:
               - Chạm trực tiếp vào bất kỳ mục menu nào để chọn và xác nhận ngay lập tức.
               - Khắc phục triệt để lệch toạ độ trên màn hình tai thỏ / tỷ lệ dài.
            5. **Tương tác toàn diện Menu tranh tùy biến (Custom Picture Menu)**:
               - Chạm/click trực tiếp vào toàn bộ 8 nút của Menu tranh trong game.
               - Chạm ra ngoài hoặc bấm HỦY để đóng menu nhanh.
            6. **Tương thích hoàn hảo trên Android & iOS**:
               - Tích hợp chuẩn Webview Asset Loader và WKWebView, khắc phục hoàn toàn lỗi `Failed to load: data/Actors.json` và lỗi CORS.
               - Tối ưu hóa file IPA chuẩn, đã làm sạch chữ ký để sẵn sàng ký bằng Sideloadly / Scarlet / Esign / AltStore / TrollStore.

            ---

            ## 📖 Hướng dẫn cài đặt:
            - **Trên Android**: Tải file `Memelis-RPG-Vietsub.apk` về máy -> Chọn file để Cài đặt (nếu máy hỏi quyền cài ứng dụng ngoài CH Play, chọn *Cho phép*).
            - **Trên iOS**: Tải file `Memelis-RPG-Vietsub.ipa` -> Ký và cài đặt qua **Sideloadly** (trên máy tính) hoặc **Scarlet / Esign / TrollStore / AltStore** trực tiếp trên iPhone/iPad.
          files: |
            Memelis-RPG-Vietsub.apk
            Memelis-RPG-Vietsub.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
