name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build iOS IPA (Clean Signable)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build iOS Project & IPA
        run: |
          cordova create memelis_ios com.hoangtuan.memelis MemelisRPG
          cd memelis_ios
          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="com.hoangtuan.memelis" version="1.0.0" xmlns="http://cordova.apache.org/ns/1.0" xmlns:cdv="http://cordova.apache.org/ns/1.0">
              <name>MemelisRPG</name>
              <description>Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt</description>
              <author email="hoangtuan@users.noreply.github.com">Hoang Tuan</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="app://localhost/*" />
              <allow-navigation href="http://*/*" />
              <allow-navigation href="https://*/*" />
              <preference name="Orientation" value="landscape" />
              <preference name="Fullscreen" value="true" />
              <platform name="ios">
                  <preference name="scheme" value="app" />
                  <preference name="hostname" value="localhost" />
              </platform>
          </widget>
          EOF
          
          rm -rf www/*
          cp -r ../www/* www/
          
          cordova platform add ios
          cd platforms/ios
          
          xcodebuild -project "MemelisRPG.xcodeproj" -scheme "MemelisRPG" -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          
          rm -rf Payload
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/MemelisRPG.app" Payload/
          
          rm -rf Payload/MemelisRPG.app/_CodeSignature
          find Payload/MemelisRPG.app -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          
          chmod -R 755 Payload/MemelisRPG.app
          
          zip -qry ../../../Memelis-RPG-Vietsub.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Memelis-RPG-iOS-IPA
          path: Memelis-RPG-Vietsub.ipa

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Memelis' RPG ~Nữ Thánh, Gacha và Hầm Ngục Nguy Hiểm~ Tiếng Việt (v1.0.0)"
          files: Memelis-RPG-Vietsub.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
